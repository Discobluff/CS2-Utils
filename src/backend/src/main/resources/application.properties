spring.application.name=springboot
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=cs2

spring.flyway.locations=classpath:/db/migration
spring.flyway.schemas=cs2
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/cs2utils}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:secret}

assets.path=${ASSETS_PATH:src/main/assets}