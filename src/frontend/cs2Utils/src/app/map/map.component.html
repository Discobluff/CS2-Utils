<div class="list-selector">
    <h2 class="list-selector-title">Teams</h2>
    <div class="list">
        <div class="list-element" *ngFor="let team of teams" [id]="team.id" [class.list-element-selected]="team.id === teamSelected" (click)="pickTeam(team.id)">
            <img src="assets/teams/{{team.id}}.png" alt="Team icon" class="list-element-icon">
            <p>{{team.name}}</p>
        </div>

    </div>

</div>
